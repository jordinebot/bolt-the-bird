name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.161.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bolt-the-bird
          fetch-depth: 0

      - name: Check out hugo-leyline
        uses: actions/checkout@v7
        with:
          repository: jordinebot/hugo-leyline
          path: hugo-leyline

      - name: Check out hugo-mtg-shortcodes
        uses: actions/checkout@v7
        with:
          repository: jordinebot/hugo-mtg-shortcodes
          path: hugo-mtg-shortcodes

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bolt-the-bird/go.mod
          cache-dependency-path: bolt-the-bird/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bolt-the-bird/package-lock.json

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install npm deps (Pagefind)
        working-directory: bolt-the-bird
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Cache Hugo getresource (Scryfall API responses)
        uses: actions/cache@v5
        with:
          path: ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-getresource-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-getresource-

      - name: Limit Hugo worker concurrency for Scryfall
        run: echo "HUGO_NUMWORKERMULTIPLIER=1" >> "$GITHUB_ENV"

      - name: Build
        working-directory: bolt-the-bird
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --gc

      - name: Index with Pagefind
        working-directory: bolt-the-bird
        run: npx pagefind --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: bolt-the-bird/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
